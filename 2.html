<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate - InAmigos Foundation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

.header{
    background:black;
    color:white;
    text-align:center;
    padding:50px;
}

.container{
    width:500px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

.container h2{
    color:green;
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input, select, textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    margin-top:20px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:black;
}

footer{
    background:black;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}

</style>
</head>

<body>

<div class="header">
    <h1>Support Our Cause</h1>
    <p>Your contribution helps us create a better future</p>
</div>

<div class="container">

<h2>Donation Form</h2>

<form action="thankyou.html">

<label>Full Name</label>
<input type="text" placeholder="Enter your name" required>

<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>

<label>Phone Number</label>
<input type="tel" placeholder="Enter your phone number" required>

<label>Donation Amount (₹)</label>
<input type="number" placeholder="Enter amount" required>

<label>Donation Purpose</label>
<select>
    <option>Education Support</option>
    <option>Women Empowerment</option>
    <option>Environmental Sustainability</option>
    <option>Animal Welfare</option>
    <option>Community Development</option>
</select>

<label>Message (Optional)</label>
<textarea rows="4" placeholder="Write your message"></textarea>

<button type="submit"><a href="thanks.html">Donate Now</a></button>

</form>

</div>

<footer>
    <h3>InAmigos Foundation</h3>
    <p>Together We Can Make A Difference</p>
</footer>

</body>
</html>
