<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - InAmigos Foundation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background-color:#f5f5f5;
}

/* Header */

.header{
    background:black;
    color:white;
    text-align:center;
    padding:60px;
}

.header h1{
    font-size:50px;
    margin-bottom:10px;
}

/* Gallery Section */

.gallery{
    padding:50px;
}

.gallery h2{
    text-align:center;
    color:green;
    margin-bottom:30px;
}

.gallery-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.gallery-container img{
    width:300px;
    height:220px;
    object-fit:cover;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.gallery-container img:hover{
    transform:scale(1.05);
}

/* Footer */

footer{
    background:black;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

</style>
</head>

<body>

<div class="header">
    <h1>Our Gallery</h1>
    <p>Moments of Service, Care and Impact</p>
</div>

<section class="gallery">

<h2>InAmigos Foundation Activities</h2>

<div class="gallery-container">

<img src="animal.jpg" alt="Gallery Image 1">
<img src="comunity.jpg" alt="Gallery Image 2">
<img src="health.jpg" alt="Gallery Image 3">
<img src="education.jpg" alt="Gallery Image 4">
<img src="environment.jpg" alt="Gallery Image 5">
<img src="women.jpg" alt="Gallery Image 6">
<img src="food.jpg" alt="Gallery Image 7">
<img src="dog.jpg" alt="Gallery Image 8">

</div>

</section>

<footer>
    <h3>InAmigos Foundation</h3>
    <p>Together We Can Make A Difference</p>
</footer>

</body>
</html>
